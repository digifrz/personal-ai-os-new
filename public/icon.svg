<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container with border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#primaryGrad)" opacity="0.18" filter="url(#glow)"/>

  <!-- Orbital Rings -->
  <ellipse cx="256" cy="256" rx="160" ry="68" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-dasharray="14 10" transform="rotate(-30 256 256)" opacity="0.8"/>
  <ellipse cx="256" cy="256" rx="160" ry="68" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-dasharray="14 10" transform="rotate(30 256 256)" opacity="0.8"/>

  <!-- Central Nexus Core -->
  <circle cx="256" cy="256" r="64" fill="url(#primaryGrad)" filter="url(#glow)"/>
  
  <!-- Core Sparkle Icon -->
  <path d="M256 208 L266 246 L304 256 L266 266 L256 304 L246 266 L208 256 L246 246 Z" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="7" fill="#67E8F9"/>

  <!-- Satellite Nodes -->
  <circle cx="140" cy="190" r="14" fill="#38BDF8"/>
  <circle cx="372" cy="322" r="14" fill="#EC4899"/>
  <circle cx="372" cy="190" r="10" fill="#A855F7"/>
  <circle cx="140" cy="322" r="10" fill="#6366F1"/>
</svg>
