    <script type="text/javascript">
      // 1. Ensure trailing slash on GitHub Pages repository root so relative ./assets/ resolve correctly
      (function() {
        var p = window.location.pathname;
        if (
          window.location.hostname.endsWith('github.io') &&
          !p.endsWith('/') &&
          !p.split('/').pop().includes('.')
        ) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();

      // 2. Restore path from 404.html redirect if deployed on GitHub Pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
